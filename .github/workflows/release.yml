name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: macos-15
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout Pro repo
        uses: actions/checkout@v4
        with:
          repository: Silbercue/SilbercueSwiftPro
          path: SilbercueSwiftPro
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build combined binary
        run: ./SilbercueSwiftMCP/scripts/build-combined.sh ./SilbercueSwiftPro

      - name: Prepare release assets
        id: assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BINARY="SilbercueSwiftMCP/.build/release/SilbercueSwift"

          # Ad-hoc code sign
          codesign -s - "$BINARY"

          # Staging: Binary + WDA source nebeneinander
          STAGING="release-staging"
          mkdir -p "$STAGING/SilbercueWDA"

          cp "$BINARY" "$STAGING/"
          cp -R SilbercueWDA/SilbercueWDA.xcodeproj "$STAGING/SilbercueWDA/"
          cp -R SilbercueWDA/SilbercueWDARunner "$STAGING/SilbercueWDA/"
          cp -R SilbercueWDA/Sources "$STAGING/SilbercueWDA/"
          cp    SilbercueWDA/project.yml "$STAGING/SilbercueWDA/" 2>/dev/null || true

          # Create tarball
          TARBALL="silbercueswift-${TAG_NAME}-macos-arm64.tar.gz"
          tar -czf "$TARBALL" -C "$STAGING" SilbercueSwift SilbercueWDA

          # Compute SHA256
          SHA=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)

          # MCPB bundle (zip with manifest.json at root) for the MCP Registry
          SEMVER="${TAG_NAME#v}"
          MCPB_DIR="mcpb-staging"
          mkdir -p "$MCPB_DIR/server"
          cp -R "$STAGING/SilbercueSwift" "$MCPB_DIR/server/"
          cp -R "$STAGING/SilbercueWDA" "$MCPB_DIR/server/"

          cat > "$MCPB_DIR/manifest.json" <<MANIFEST
          {
            "manifest_version": "0.3",
            "name": "silbercueswift",
            "display_name": "SilbercueSwift",
            "version": "${SEMVER}",
            "description": "The fastest MCP server for iOS development. xcresult parsing, WDA UI automation, structured test results.",
            "author": { "name": "Second Truth", "url": "https://second-truth.com/" },
            "homepage": "https://github.com/silbercue/SilbercueSwift",
            "license": "MIT",
            "server": {
              "type": "binary",
              "entry_point": "server/SilbercueSwift",
              "mcp_config": {
                "command": "\${__dirname}/server/SilbercueSwift",
                "args": [],
                "env": {}
              }
            },
            "compatibility": {
              "platforms": ["darwin"]
            }
          }
          MANIFEST

          MCPB="silbercueswift-${TAG_NAME}.mcpb"
          (cd "$MCPB_DIR" && zip -qr "../$MCPB" .)
          MCPB_SHA=$(shasum -a 256 "$MCPB" | cut -d' ' -f1)

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "mcpb=$MCPB" >> "$GITHUB_OUTPUT"
          echo "mcpb_sha256=$MCPB_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate tarball contents
        env:
          TARBALL: ${{ steps.assets.outputs.tarball }}
        run: |
          tar -tzf "$TARBALL" | grep -q "SilbercueWDA/SilbercueWDA.xcodeproj/project.pbxproj"

      - name: Validate MCPB bundle
        env:
          MCPB: ${{ steps.assets.outputs.mcpb }}
        run: |
          unzip -l "$MCPB" | grep -q "manifest.json"
          unzip -l "$MCPB" | grep -q "server/SilbercueSwift"
          unzip -p "$MCPB" manifest.json | python3 -c "import json,sys; json.load(sys.stdin)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          TARBALL: ${{ steps.assets.outputs.tarball }}
          MCPB: ${{ steps.assets.outputs.mcpb }}
          MCPB_SHA: ${{ steps.assets.outputs.mcpb_sha256 }}
        run: |
          gh release create "$TAG_NAME" "$TARBALL" "$MCPB" \
            --title "SilbercueSwift $TAG_NAME" \
            --generate-notes
          echo "MCPB SHA256: $MCPB_SHA"

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          SEMVER="${TAG_NAME#v}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/Silbercue/homebrew-silbercue.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          sed -i '' "s|version \".*\"|version \"${SEMVER}\"|" Formula/silbercueswift.rb
          sed -i '' "s|releases/download/v[^/]*/silbercueswift-v[^\"]*|releases/download/${TAG_NAME}/silbercueswift-${TAG_NAME}-macos-arm64.tar.gz|" Formula/silbercueswift.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/silbercueswift.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/silbercueswift.rb
          git commit -m "chore: update formula to ${TAG_NAME}"
          git push
